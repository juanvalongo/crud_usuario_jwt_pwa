<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <title>Usuários | CRUD JWT</title>
</head>
<body>
  <header class="topbar">
    <div>
      <strong>CRUD Usuários</strong>
      <span class="topbar-subtitle">Área protegida</span>
    </div>
    <button class="secondary small" onclick="logout()">Sair</button>
  </header>

  <main class="dashboard">
    <section class="hero">
      <div>
        <span class="eyebrow">Painel administrativo</span>
        <h1>Gerenciamento de usuários</h1>
        <p>Cadastre, consulte, edite e remova usuários.</p>
      </div>
      <button class="primary action-button" onclick="listarUsuarios()">Atualizar lista</button>
    </section>

    <section class="grid-dashboard">
      <section class="card">
        <h2>Novo usuário</h2>

        <label for="nomeNovo">Nome</label>
        <input id="nomeNovo" placeholder="Nome completo">

        <label for="emailNovo">E-mail</label>
        <input id="emailNovo" type="email" placeholder="email@exemplo.com">

        <label for="senhaNovo">Senha</label>
        <input id="senhaNovo" type="password" placeholder="Senha">

        <label for="tipoNovo">Tipo de usuário</label>
        <select id="tipoNovo">
          <option value="paciente">Paciente</option>
          <option value="medico">Médico</option>
          <option value="admin">Administrador</option>
        </select>

        <button class="primary" onclick="criarUsuario()">Criar usuário</button>
        <p id="statusCrud" class="message"></p>
      </section>

      <section class="card users-card">
        <div class="section-title">
          <div>
            <h2>Usuários cadastrados</h2>
            <p class="muted">Dados carregados pela API protegida.</p>
          </div>
        </div>

        <div id="usuarios" class="user-list"></div>
      </section>
    </section>
  </main>

  <script src="/usuarios.js"></script>
</body>
</html>
